apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: production
  labels:
    app: admin-service
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admin-service
      tier: backend
  template:
    metadata:
      labels:
        app: admin-service
        tier: backend
    spec:
      serviceAccountName: app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: admin-service
        image: polydom/admin-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3009
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: ADMIN_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: admin-database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: jwt-secret
        - name: AUTH_SERVICE_URL
          value: http://auth-service:80
        - name: USER_SERVICE_URL
          value: http://user-service:80
        - name: VENDOR_SERVICE_URL
          value: http://vendor-service:80
        - name: EVENT_SERVICE_URL
          value: http://event-service:80
        - name: BOOKING_SERVICE_URL
          value: http://booking-service:80
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3009
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: production
spec:
  selector:
    app: admin-service
    tier: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3009
  type: ClusterIP
