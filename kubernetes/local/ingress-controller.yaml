---
# Local dev nginx reverse proxy — replaces the need for an external ingress controller.
# Routes: all API prefixes → api-gateway, /api/* → api-gateway (prefix stripped),
#         /admin/* → admin-frontend, /* → frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-config
  namespace: polydom-dev
data:
  nginx.conf: |
    events {}
    http {
      # Resolve upstreams at request time instead of startup so nginx doesn't
      # crash when upstream services haven't been created yet.
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

      server {
        listen 80;
        server_name localhost;

        # API Gateway — all backend service routes
        # Regex matches any top-level API prefix: /auth, /events, /users, /groups,
        # /vendors, /venues, /timeslots, /agent, /tracking, /health
        location ~ ^/(auth|events|users|groups|vendors|venues|timeslots|agent|tracking|health)(/|$) {
          set $apigw api-gateway:3000;
          proxy_pass http://$apigw;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # K8s Ingress-compatible /api prefix — strips /api before forwarding
        # (e.g. /api/auth/login → /auth/login at the gateway)
        location /api/ {
          set $apigw api-gateway:3000;
          proxy_pass http://$apigw/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Frontend
        location /admin {
          set $adminfe admin-frontend:3000;
          proxy_pass http://$adminfe/admin;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend — everything else
        location / {
          set $fe frontend:3000;
          proxy_pass http://$fe;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  namespace: polydom-dev
  labels:
    app: nginx-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-ingress
  template:
    metadata:
      labels:
        app: nginx-ingress
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "16Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: nginx-ingress-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress
  namespace: polydom-dev
spec:
  selector:
    app: nginx-ingress
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
