# Local dev nginx reverse proxy — replaces the need for an external ingress controller.
# Routes: /api/* → api-gateway, /admin/* → admin-frontend, /* → frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-config
  namespace: polydom-dev
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        server_name localhost;

        # API Gateway
        location /api/ {
          proxy_pass http://api-gateway:3000/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
          proxy_pass http://api-gateway:3000/auth/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Frontend
        location /admin {
          proxy_pass http://admin-frontend:3000/admin;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend — everything else
        location / {
          proxy_pass http://frontend:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  namespace: polydom-dev
  labels:
    app: nginx-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-ingress
  template:
    metadata:
      labels:
        app: nginx-ingress
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "16Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: nginx-ingress-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress
  namespace: polydom-dev
spec:
  selector:
    app: nginx-ingress
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
