apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumers
  namespace: production
  labels:
    app: kafka-consumers
    tier: backend
    component: python-workers
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kafka-consumers
      tier: backend
  template:
    metadata:
      labels:
        app: kafka-consumers
        tier: backend
        component: python-workers
    spec:
      serviceAccountName: app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka-consumers
        image: polydom/python-workers:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "kafka-consumers.user_activity"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BROKERS
        - name: KAFKA_CONSUMER_GROUP
          value: "python-workers-prod"
        - name: BATCH_SIZE
          value: "100"
        - name: BATCH_TIMEOUT_MS
          value: "5000"
        - name: FEATURE_STORE_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
