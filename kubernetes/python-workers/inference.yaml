apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: production
  labels:
    app: inference
    tier: backend
    component: python-workers
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: inference
      tier: backend
  template:
    metadata:
      labels:
        app: inference
        tier: backend
        component: python-workers
    spec:
      serviceAccountName: app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inference
        image: polydom/python-workers:latest
        imagePullPolicy: IfNotPresent
        command: ["uvicorn", "inference.api:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: VECTOR_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: vector-database-url
        - name: MODEL_PATH
          value: "/data/training/models"
        - name: EMBEDDINGS_PATH
          value: "/data/training/models"
        - name: EVENT_CATALOG_PATH
          value: "/data/event_catalog.json"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BROKERS
        - name: FEATURE_STORE_URL
          value: "redis://redis-service:6379"
        - name: MODEL_VERSION
          value: "production"
        - name: SEARCH_PERSONALIZATION_ALPHA
          value: "0.4"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: training-data
          mountPath: /data/training
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data-pvc
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: production
  labels:
    app: inference
    component: python-workers
spec:
  selector:
    app: inference
    tier: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
