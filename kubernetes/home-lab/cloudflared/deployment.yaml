# cloudflared — Cloudflare Tunnel daemon
#
# Connects to Cloudflare edge, routes polydom.pahakrai.xyz
# traffic to the api-gateway service inside the cluster.
# Tunnel token is stored in a secret managed by Terraform
# (cloudflared-tunnel-token). Fallback env var CLOUDFLARE_TUNNEL_TOKEN
# supports manual provisioning when Terraform wasn't used.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: polydom-prod
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        imagePullPolicy: Always
        args:
          - tunnel
          - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-tunnel-token
              key: tunnel-token
              optional: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - cloudflared
            - --version
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
