# Redpanda — Kafka API-compatible message broker (no Zookeeper)
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: polydom-prod
spec:
  selector:
    app: redpanda
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka-api
  - port: 9644
    targetPort: 9644
    name: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: polydom-prod
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
        args:
        - redpanda
        - start
        - --smp=1
        - --memory=512M
        - --reserve-memory=0M
        - --overprovisioned
        - --kafka-addr=0.0.0.0:9092
        - --advertise-kafka-addr=kafka:9092
        - --admin-addr=0.0.0.0:9644
        ports:
        - containerPort: 9092
          name: kafka-api
        - containerPort: 9644
          name: admin
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        startupProbe:
          exec:
            command:
            - rpk
            - cluster
            - health
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - rpk
            - cluster
            - health
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - rpk
            - cluster
            - health
          periodSeconds: 10
