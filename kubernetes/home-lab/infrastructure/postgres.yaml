# PostgreSQL — single instance for all services (database-per-service pattern)
# Uses pgvector for ML embeddings. Init scripts create all databases on first boot.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: polydom-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: polydom-prod
data:
  01-create-databases.sql: |
    CREATE DATABASE gateway_db;
    CREATE DATABASE auth_db;
    CREATE DATABASE user_db;
    CREATE DATABASE vendor_db;
    CREATE DATABASE event_db;
    CREATE DATABASE booking_db;
    CREATE DATABASE notification_db;
    CREATE DATABASE analytics_db;
    CREATE DATABASE admin_db;
    CREATE DATABASE agent_db;
    CREATE DATABASE vector_db;
  02-create-extensions.sql: |
    \c vector_db
    CREATE EXTENSION IF NOT EXISTS vector;
    \c agent_db
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: polydom-prod
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: postgres-password
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - eventbooking
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - eventbooking
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: polydom-prod
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
