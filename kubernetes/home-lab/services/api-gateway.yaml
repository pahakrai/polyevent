# API Gateway — single entry point for all client traffic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: polydom-production
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
      - name: ghcr-image-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: ghcr.io/pahakrai/polydom/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: NODE_ENV
          value: production
        - name: API_GATEWAY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: gateway-database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        - name: AUTH_SERVICE_URL
          value: http://auth-service:3000
        - name: USER_SERVICE_URL
          value: http://user-service:3000
        - name: VENDOR_SERVICE_URL
          value: http://vendor-service:3000
        - name: EVENT_SERVICE_URL
          value: http://event-service:3000
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: polydom-production
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
    name: http
