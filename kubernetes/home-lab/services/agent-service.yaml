# Agent Service — LLM-powered assistant with pgvector knowledge base
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: polydom-production
  labels:
    app: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      imagePullSecrets:
      - name: ghcr-image-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent-service
        image: ghcr.io/pahakrai/polydom/agent-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3010
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: NODE_ENV
          value: production
        - name: AGENT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: agent-database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        - name: PORT
          value: "3010"
        - name: LLM_PROVIDER
          value: anthropic
        - name: LLM_MODEL
          value: deepseek-v4-pro
        - name: LLM_API_URL
          value: https://api.deepseek.com/anthropic
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: api-key
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: deepseek-api-key
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3010
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: polydom-production
spec:
  selector:
    app: agent-service
  ports:
  - port: 3010
    targetPort: 3010
    name: http
