# ============================================================
# Build, push, and update GitOps repo for home-lab production.
#
# Images are pushed to ghcr.io (free for public repos).
# ArgoCD watches kubernetes/home-lab/ and syncs automatically.
#
# GitOps flow:
#   1. Build + push images to ghcr.io with :sha and :latest tags
#   2. Update kubernetes/home-lab/kustomization.yaml image tags
#   3. Commit + push — ArgoCD detects the change and syncs
#
# Required GitHub Secrets:
#   REGISTRY_TOKEN — GitHub PAT with write:packages scope
#   REGISTRY        — ghcr.io (set by Terraform or manually)
#   REGISTRY_USER   — GitHub username (set by Terraform or manually)
# ============================================================

name: Build & Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ${{ secrets.REGISTRY }}

jobs:
  # ------------------------------------------------------------------
  # Detect which deployable services changed (NX affected + git diff)
  # ------------------------------------------------------------------
  detect-changes:
    name: Detect Affected Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - run: corepack enable && yarn install --immutable

      - name: Compute affected services
        id: affected
        run: |
          DEPLOYABLE='["api-gateway","auth-service","user-service","vendor-service","event-service","booking-service","search-service","notification-service","admin-service","agent-service","frontend","admin-frontend"]'

          AFFECTED=$(yarn nx show projects --affected --base=origin/main --head=HEAD --json)
          echo "All NX-affected projects: $AFFECTED"

          FILTERED=$(echo "$AFFECTED" | jq -c "[.[] | select(. as \$p | $DEPLOYABLE | index(\$p))]")

          # Check python-workers separately (not NX-managed)
          if git diff --name-only origin/main..HEAD | grep -q '^apps/python-workers/'; then
            FILTERED=$(echo "$FILTERED" | jq -c '. + ["python-workers"]')
          fi

          echo "Deployable affected: $FILTERED"
          echo "services=$FILTERED" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # Lint & test (always runs)
  # ------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: corepack enable && yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn validate:dockerfiles

  # ------------------------------------------------------------------
  # Build & push only affected service images to ghcr.io
  # ------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve Dockerfile path
        id: paths
        run: |
          case "${{ matrix.service }}" in
            frontend|admin-frontend)
              echo "dockerfile=apps/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
              echo "target=runner" >> $GITHUB_OUTPUT ;;
            python-workers)
              echo "dockerfile=apps/python-workers/Dockerfile" >> $GITHUB_OUTPUT
              echo "target=" >> $GITHUB_OUTPUT ;;
            *)
              echo "dockerfile=apps/nestjs-services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
              echo "target=production" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.paths.outputs.dockerfile }}
          target: ${{ steps.paths.outputs.target }}
          push: true
          tags: |
            ghcr.io/${{ secrets.REGISTRY_USER }}/polydom/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ secrets.REGISTRY_USER }}/polydom/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Update kustomization.yaml image tags (GitOps — ArgoCD syncs)
  # ------------------------------------------------------------------
  update-manifests:
    name: Update K8s Manifests
    needs: [build-and-push, detect-changes]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Update image tags in kustomization.yaml
        run: |
          cd kubernetes/home-lab
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            echo "Updating $svc -> ${{ github.sha }}"
            kustomize edit set image \
              "ghcr.io/${{ secrets.REGISTRY_USER }}/polydom/$svc:${{ github.sha }}"
          done

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/home-lab/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "cd: update image tags to ${{ github.sha }}"
            git push
          fi
